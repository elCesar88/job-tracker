{% extends "base.html" %}
{% block title %}Edit application - JobTracker{% endblock %}

{% block content %}
<h1>Eddit application</h1>'

<form method="post">
    <label for="company">Company</label>
    <input type="text" id="company" name="company" value="{{ application.company }}" required>

    <label for="role">Role</label>
    <input type="text" id="role" name="role" value="{{ application.role }}" required>

    <label for="status">Status</label>
    <select id="status" name="status">
        <option value="Applied" {% if application.status==Applied %}Selected{% endif %}>Applied</option>
        <option value="Interviewing" {% if application.status==Applied %}Interviewing{% endif %}>Interviewing
        </option>
        <option value="Offer" {% if application.status==Applied %}Offer{% endif %}>Offer</option>
        <option value="Rejected" {% if application.status==Applied %}Rejected{% endif %}>Rejected</option>
    </select>

    <label for="date_applied">Date applied </label>
    <input type="date" id="date_applied" name="date_applied" value="{{ application.date_applied }}" required>

    <button type="submit">Save changes</button>
</form>
{% endblock %}
