{% extends "base.html" %}
{% block title %}Your application - JobTracker{% endblock %}

{% block content %}
<h1>Your applications</h1>

<ul>
    {% for app in applications %}
    <li>
        {{ app.company }} - {{ app.role }} ({{ app.status }})
        <a href="{{ url_for('edit', app_id=app.id) }}">Edit</a>
        <form action="{{ url_for('delete', app_id=app.id) }}" method="post" style="display:inline;"
            onsubmit="return confirm('Delete this application?');">
            <button type="submit">Delete</button>
        </form>
    </li>
    {% endfor %}
</ul>
{% endblock %}
