{% extends "base.html" %}
{% block title %}Your application - JobTracker{% endblock %}

{% block content %}
<h1>Your applications</h1>

<ul>
    {% for app in applications %}
    <li>
        <div class="app-info">
            <strong>{{ app.company }}</strong> - {{ app.role }}
            <span class="status-pill status-{{ app.status|lower }}">{{ app.status }}</span>
        </div>
        <div class="app-actions">
            <a href="{{ url_for('edit', app_id=app.id) }}" class="link-action">Edit</a>
            <form action="{{ url_for('delete', app_id=app.id) }}" method="post" style="display:inline;"
                onsubmit="return confirm('Delete this application?');">
                <button type="submit" class="link-action link-danger">Delete</button>
            </form>
        </div>
    </li>
    {% endfor %}
</ul>
{% endblock %}
