<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" <title>JobTracker</title>
</head>

<body>
    <h1>Your applications</h1>

    <a href="{{ url_for('add') }}">+ Add application</a>

    <ul>
        {% for app in applications %}
        <li>{{ app.company }} - {{ app.role }} ({{ app.status }})</li>
        {% endfor %}
    </ul>
</body>

</html>
